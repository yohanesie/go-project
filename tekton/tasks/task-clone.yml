apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone-simple
  namespace: tekton-pipelines
spec:
  description: Clone a Git repository into the shared workspace
  params:
    - name: url
      type: string
      description: Git repository URL
    - name: revision
      type: string
      description: Branch, tag, or commit to checkout
      default: main
  workspaces:
    - name: output
      description: Target directory for cloned repo
  steps:
    - name: clone
      image: alpine/git:latest
      workingDir: $(workspaces.output.path)
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          echo "Cloning $(params.url) @ $(params.revision)"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || rm -rf ./* ./.git
          git clone --depth 1 --branch $(params.revision) $(params.url) .
          echo "Clone selesai!"
          ls -la
