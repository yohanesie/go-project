# ================================================================
# Docker Hub Registry Secret untuk Tekton Pipeline
# ================================================================
#
# CARA PENGGUNAAN (pilih salah satu):
#
# OPSI A - Pakai PowerShell helper script (DIREKOMENDASIKAN):
#   .\tekton\create-docker-secret.ps1 -Username "yohanesie86" -Password "YOUR_DOCKER_HUB_TOKEN"
#
# OPSI B - Edit file ini langsung:
#   1. Ganti DOCKER_USERNAME dengan: yohanesie86
#   2. Ganti DOCKER_TOKEN dengan Docker Hub Access Token kamu
#      (buat di: https://hub.docker.com/settings/security)
#   3. Jalankan: kubectl apply -f tekton/secret.yml
#
# CATATAN KEAMANAN:
#   - JANGAN commit file ini ke Git setelah diisi credential asli!
#   - Gunakan Docker Hub Access Token, bukan password biasa
#   - Tambahkan tekton/secret.yml ke .gitignore
# ================================================================

apiVersion: v1
kind: Secret
metadata:
  name: dockerhub-secret
  namespace: tekton-pipelines
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "https://index.docker.io/v1/": {
          "username": "DOCKER_USERNAME",
          "password": "DOCKER_TOKEN"
        }
      }
    }
