name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  IMAGE_NAME: go-project
  GO_VERSION: "1.27"
  NODE_VERSION: "22"

jobs:
  # ============================================================
  # JOB 1 - BUILD DOCKER IMAGE (Go)
  # ============================================================
  build-docker:
    name: "Build Docker Image (Go)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Menggunakan golang:1.27-alpine sesuai Dockerfile
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (Go backend stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Target hanya stage backend-builder agar fokus build Go
          target: backend-builder
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 2 - UNIT TEST BACKEND (Go)
  # ============================================================
  test-backend:
    name: "Unit Test - Go Backend"
    runs-on: ubuntu-latest
    # Jalankan di dalam container golang:1.27-alpine sesuai instruksi
    container:
      image: golang:1.27-alpine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: apk --no-cache add git gcc musl-dev

      - name: Download Go modules
        run: go mod download

      - name: Verify Go modules
        run: go mod verify

      - name: Run Go unit tests
        run: |
          go test ./... \
            -v \
            -race \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -timeout 120s

      - name: Show test coverage summary
        run: go tool cover -func=coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-report
          path: coverage.out
          retention-days: 7

  # ============================================================
  # JOB 3 - UNIT TEST FRONTEND (Vue.js / Vite)
  # ============================================================
  test-frontend:
    name: "Unit Test - Frontend (Vue.js)"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Frontend unit tests
        run: npm test --if-present

      - name: Build frontend (smoke test)
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ui/dist/
          retention-days: 7

  # ============================================================
  # JOB 4 - BUILD & PUSH FULL IMAGE (hanya di branch main/master)
  # ============================================================
  build-and-push:
    name: "Build & Push Full Image"
    runs-on: ubuntu-latest
    needs: [ build-docker, test-backend, test-frontend ]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push full Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
