apiVersion: v1
kind: Service
metadata:
  name: go-frontend-service
  namespace: dev
  labels:
    app: go-frontend
spec:
  type: LoadBalancer
  selector:
    app: go-frontend
  ports:
    - name: http
      protocol: TCP
      port: 8080        # Akses langsung dari browser Windows: http://localhost:8080
      targetPort: 80    # Port Nginx di dalam pod frontend
