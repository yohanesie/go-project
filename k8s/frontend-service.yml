apiVersion: v1
kind: Service
metadata:
  name: go-frontend-service
  namespace: dev
  labels:
    app: go-frontend
spec:
  type: NodePort
  selector:
    app: go-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080   # Akses dari browser: http://localhost:30080
