apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-frontend
  namespace: dev
  labels:
    app: go-frontend
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: go-frontend
        tier: frontend
    spec:
      containers:
        - name: go-frontend
          image: yohanesie86/go-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
