apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-backend
  namespace: dev
  labels:
    app: go-backend
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: go-backend
        tier: backend
    spec:
      containers:
        - name: go-backend
          image: yohanesie86/go-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8888
              protocol: TCP
          env:
            - name: TZ
              value: Asia/Jakarta
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8888
            initialDelaySeconds: 5
            periodSeconds: 10
